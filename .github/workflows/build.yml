name: Build

on:
  push:
    branches:
      - main
      - master
      - plus
    tags:
      - "v*"
  pull_request:
    branches:
      - plus
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            edition: lite
            args: --bundles dmg
          - platform: windows-latest
            edition: lite
            args: --no-bundle
          - platform: macos-latest
            edition: plus
            args: --bundles dmg
          - platform: windows-latest
            edition: plus
            args: --no-bundle

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check edition consistency
        run: npm run check:editions

      - name: Check file behavior
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Read edition version
        id: edition-version
        shell: pwsh
        run: |
          $edition = "${{ matrix.edition }}"
          $versions = Get-Content editionVersions.json -Raw | ConvertFrom-Json
          $version = $versions.PSObject.Properties[$edition].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build ${{ matrix.edition }} app
        run: npm run tauri:build:${{ matrix.edition }} -- ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: md-view-${{ matrix.edition }}-${{ steps.edition-version.outputs.version }}-${{ matrix.platform }}
          path: |
            release/md-view-${{ matrix.edition }}_*.exe
            release/md-view-${{ matrix.edition }}_*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
