[package]
name = "md-view"
version = "1.2.0"
description = "Lightweight local Markdown reader and editor"
authors = ["Ferris"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "md_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "md-view"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
ignore = "=0.4.33"
notify = "=8.2.0"
trash = "=5.2.8"
tempfile = "3.23"
blake3 = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "=0.61.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
